services:
  - type: web
    name: giogit
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev --include=optional && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: giocasa
      - key: ADMIN_PASSCODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TZ
        value: Asia/Kolkata
