[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests directly to Render backend (Zero CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://giogit.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
